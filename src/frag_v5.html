const IC={dash:"M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z",users:"M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M21 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8",user:"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8",clock:"M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 6v6l4 2",calendar:"M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2",wallet:"M3 7a2 2 0 0 1 2-2h14v4M3 7v10a2 2 0 0 0 2 2h16V9H5a2 2 0 0 1-2-2M16 14h2",target:"M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4",chart:"M3 3v18h18M7 15l4-4 3 3 5-6",sliders:"M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6",file:"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h8",shield:"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10",briefcase:"M3 7h18v13H3zM8 7V4h8v3"};
const ICN={"HR Dashboard":"dash","Payroll Dashboard":"wallet","My Workspace":"user","Employment Contracts":"file","Employee Documents":"file","Departments":"briefcase","Tax & Insurance Settings":"shield","Audit Logs":"shield"},ICG={Overview:"dash",People:"users","Time & Attendance":"clock",Leave:"calendar",Payroll:"wallet",Talent:"target",Reports:"chart",Administration:"sliders"};
const ic=(n,g)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${IC[ICN[n]||ICG[g]]}"/></svg>`;
const ini=n=>String(n||"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
let FM=false;
function nav(){$("#nav").innerHTML=Object.entries(NAV).filter(([g])=>ALLOW(g)).map(([g,items])=>`<div class="grp"><span>${g}</span></div>`+items.map(([n,k])=>k?`<button class="nav ${k===page?"on":""}" data-k="${k}" title="${n}" ${canSee(k)?"":"disabled"}>${ic(n,g)}<span class="lb">${n}</span></button>`:`<button class="nav off" disabled title="${n} (planned)">${ic(n,g)}<span class="lb">${n}</span><span class="tag">Soon</span></button>`).join("")).join("");
 document.querySelectorAll(".nav[data-k]").forEach(b=>b.onclick=()=>{page=b.dataset.k;PG=0;$("#side").classList.remove("open");closeDr();draw()})}
function updBell(){const b=$("#bdg");if(role==="Employee"||!canSee("dash")){b.hidden=true;return}const m=page==="dash"?M:build(),n=m.alerts.filter(a=>a[0]!=="low"&&a[3]).length;b.textContent=n;b.hidden=!n}
function openNotif(){if(role==="Employee"||!canSee("dash"))return;const m=build(),order={high:0,med:1,low:2};LASTDRILL=null;$("#dt").textContent="Notifications";$("#dd").textContent="Items that need attention, most urgent first. Select one to see the records.";
 $("#db").innerHTML=m.alerts.filter(a=>a[3]).sort((a,b)=>order[a[0]]-order[b[0]]).map(([sv,t,id,n])=>`<button class="al" data-d="${id}"><i class="sv ${sv}"></i><span>${t}</span><span class="badge ${sv==="high"?"s-er":sv==="med"?"s-wn":"s-mu"}">${n}</span></button>`).join("")||`<div class="empty">Nothing needs attention right now.</div>`;$("#dx").hidden=true;$("#drawer").classList.add("open");$("#dcl").focus()}
function draw(){const[t,d]=META[page];$("#title").textContent=t;$("#desc").textContent=d;nav();
 const grp={dash:"Overview",work:"Overview",emp:"People",comp:"Payroll"}[page];$("#crumb").innerHTML=`<span>SMR</span><span>${grp}</span><b>${t}</b>`;
 document.querySelectorAll("[data-mode]").forEach(b=>{const on=b.dataset.mode===MODE;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});
 $("#me").textContent=ini(role);$("#gs").disabled=!canSee("emp");$("#gs").placeholder=canSee("emp")?"Search employees":"Search not available";
 $("#strip").innerHTML=(MODE==="sample"?`<span class="chip">Sample data</span><span>Generated for demonstration. These are not real SMR employees or records.</span>`:`<span class="chip">My records</span><span>Only the employees you entered. Cards without a data source show as unavailable.</span>`)+`<span class="grow"></span>`;
 $("#view").innerHTML=page==="dash"?dash():page==="emp"?emp():page==="work"?work():comp();wire();updBell()}
function openDr(id){const f=M.DR&&M.DR[id];if(!f)return;const o=f();LASTDRILL=o;
 $("#dt").textContent=o.title;$("#dd").textContent=o.desc||"";
 $("#db").innerHTML=o.rows.length?`<div class="wrap"><table><tr>${o.cols.map(c=>`<th>${c}</th>`).join("")}</tr>${o.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div>`:`<div class="empty">${o.cols.length?"No records match the current filters.":esc(o.desc)}</div>`;
 $("#dx").hidden=!o.rows.length;$("#drawer").classList.add("open");$("#dcl").focus()}
function closeDr(){$("#drawer").classList.remove("open")}
function csv(){if(!LASTDRILL||!LASTDRILL.rows.length)return;const q=v=>'"'+String(v).replace(/"/g,'""').replace(/^([=+\-@])/,"'$1")+'"',t=[LASTDRILL.cols,...LASTDRILL.rows].map(r=>r.map(q).join(",")).join("\n"),b=$("#dx"),done=()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy as CSV",1600)};
 const fb=()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();done()};
 try{navigator.clipboard.writeText(t).then(done,fb)}catch(e){fb()}}
function ask(msg,label,fn){$("#cm").textContent=msg;const y=$("#cy");y.textContent=label;$("#confirm").hidden=false;y.focus();y.onclick=()=>{$("#confirm").hidden=true;fn()};$("#cn").onclick=()=>{$("#confirm").hidden=true}}
document.addEventListener("click",ev=>{const t=ev.target.closest("[data-f],[data-d],[data-mode],[data-pg],#dcl,#dx");if(!t)return;
 if(t.id==="dcl")return closeDr();if(t.id==="dx")return csv();
 if(t.dataset.mode){MODE=t.dataset.mode;try{localStorage.setItem("smr_mode",MODE)}catch(e){}F={dept:"",loc:"",mgr:"",type:"",status:""};PG=0;closeDr();return draw()}
 if(t.dataset.pg){PG+=+t.dataset.pg;return draw()}
 if(t.dataset.d)return openDr(t.dataset.d);
 if(t.dataset.f){const[k,v]=t.dataset.f.split(":");F[k]=F[k]===v?"":v;draw()}});
document.addEventListener("click",ev=>{const t=ev.target.closest("[data-ws]");if(!t)return;const a=t.dataset.ws;
 if(a==="punch"){const e=allEmps().find(x=>x.no===WSNO),k=WSNO+"|"+iso(T0);PUNCH[k]=(PUNCH[k]||[]).concat(new Date().toISOString());saveW();draw()}
 if(a.startsWith("cancel:")){const id=+a.slice(7);ask("Cancel this leave request?","Cancel request",()=>{LR=LR.filter(r=>r.id!==id);saveW();draw()})}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDr()});
function wire(){const ws=$("#wsel");if(ws)ws.onchange=e=>{WSNO=e.target.value;draw()};
 const lf=$("#lf");if(lf)lf.onsubmit=ev=>{ev.preventDefault();const o=Object.fromEntries(new FormData(lf)),er=$("#lerr"),e=allEmps().find(x=>x.no===WSNO),b=balances(e)[o.type];
  if(o.end<o.start){er.textContent="The end date must be on or after the start date.";return}
  if(e.hire&&o.start<e.hire){er.textContent="The leave cannot start before the hire date ("+e.hire.split("-").reverse().join("/")+").";return}
  const days=wdays(o.start,o.end);if(!days){er.textContent="The selected dates contain no working days.";return}
  if(LR.some(r=>r.mode===MODE&&r.no===e.no&&r.status!=="Rejected"&&r.start<=o.end&&r.end>=o.start)){er.textContent="These dates overlap an existing leave request.";return}
  if(b.avail!=null&&days>b.avail){er.textContent="Not enough balance: "+b.avail+" day(s) available, "+days+" requested.";return}
  LR.push({id:Date.now(),mode:MODE,no:e.no,type:o.type,start:o.start,end:o.end,days,note:o.note,status:"Pending"});saveW();draw()};document.querySelectorAll("select[data-k]").forEach(s=>s.onchange=e=>{F[s.dataset.k]=e.target.value;PG=0;draw()});
 const pm=$("#pm");if(pm)pm.onchange=e=>{PM=+e.target.value;draw()};const rg=$("#rg");if(rg)rg.onchange=e=>{RANGE=+e.target.value;draw()};
 const r=$("#fr");if(r)r.onclick=()=>{F={dept:"",loc:"",mgr:"",type:"",status:""};draw()};const rf=$("#rf");if(rf)rf.onclick=()=>{REFRESHED=new Date();draw()};
 const q=$("#q");if(q)q.oninput=e=>{Q=e.target.value;PG=0;const p=e.target.selectionStart;draw();const n=$("#q");n.focus();n.setSelectionRange(p,p)};
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ask("Archive this employee? Their record is hidden from the directory.","Archive",()=>{E=E.filter(e=>e.no!==b.dataset.del);save();draw()})});
 const f=$("#ef");if(f)f.onsubmit=ev=>{ev.preventDefault();const o=Object.fromEntries(new FormData(f));o.no=o.no.trim();o.name=o.name.trim();
  if(E.some(e=>e.no===o.no)){$("#er").textContent="Employee number "+o.no+" already exists. Use a unique number.";return}
  if(o.end&&o.end<o.hire){$("#er").textContent="Contract end date must be after the hire date.";return}
  if(o.term&&o.term<o.hire){$("#er").textContent="Employment end date must be after the hire date.";return}
  if(o.status==="Terminated"&&!o.term){$("#er").textContent="Enter the employment end date for a terminated employee.";return}
  E.push(o);save();draw()}}
document.addEventListener("click",ev=>{const t=ev.target.closest("[data-x]");if(!t)return;const x=t.dataset.x;
 if(x==="more"){FM=!FM;draw()}
 if(x==="collapse"){const r=document.body.classList.toggle("rail");try{localStorage.setItem("smr_rail",r?"1":"0")}catch(e){}}
 if(x==="bell")openNotif()});
$("#gs").onkeydown=e=>{if(e.key==="Enter"&&canSee("emp")){Q=e.target.value;page="emp";PG=0;closeDr();draw()}};
try{if(localStorage.getItem("smr_rail")==="1")document.body.classList.add("rail")}catch(e){}
draw();
</script>
