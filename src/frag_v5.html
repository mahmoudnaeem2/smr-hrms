<style>

:root{--brand:#0460B5;--brand-d:#034a8c;--btn:#0460B5;--btn-d:#034a8c;--hero:#0460B5;--bg:#f2f5fa;--surf:#ffffff;--bd:#e2e8f1;--tx:#0f1b2d;--mu:#5b6b82;--soft:#e8f1fb;--ok:#177a47;--wn:#8f5f00;--er:#b42318;--wnb:#fff3d1;--erb:#fde7e4;--okb:#e1f4e9;--c2:#6fa8dc;--c3:#9aa7b5;--sh:0 1px 2px rgba(15,27,45,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--brand:#5aa9ee;--brand-d:#8cc2f4;--btn:#2a78c4;--btn-d:#3a89d6;--hero:#0b4f93;--bg:#0a111d;--surf:#111b2c;--bd:#223049;--tx:#e8eef8;--mu:#94a5bd;--soft:#16294a;--ok:#5fd08f;--wn:#f0c25a;--er:#ff8f85;--wnb:#3a3016;--erb:#40201d;--okb:#17372a;--c2:#8ec0ee;--c3:#6b7b8d;--sh:none}}
:root[data-theme="dark"]{color-scheme:dark;--brand:#5aa9ee;--brand-d:#8cc2f4;--btn:#2a78c4;--btn-d:#3a89d6;--hero:#0b4f93;--bg:#0a111d;--surf:#111b2c;--bd:#223049;--tx:#e8eef8;--mu:#94a5bd;--soft:#16294a;--ok:#5fd08f;--wn:#f0c25a;--er:#ff8f85;--wnb:#3a3016;--erb:#40201d;--okb:#17372a;--c2:#8ec0ee;--c3:#6b7b8d;--sh:none}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surf);z-index:10}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}h2{font-size:15px;font-weight:600;margin:0 0 8px}
button,input,select{font:inherit}
.shell{display:flex;min-height:100vh}
#side{width:288px;flex:none;background:var(--surf);border-right:1px solid var(--bd);display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));z-index:20;transition:width .15s}
.brand{display:flex;align-items:center;gap:12px;padding:18px 16px 10px}.brand img{width:68px;height:68px;flex:none;display:block}.prod{font-weight:600;font-size:14px;line-height:1.25}.prod small{display:block;font-weight:400;color:var(--mu);font-size:12px}
#nav{flex:1;overflow-y:auto;padding:4px 10px 12px}
.grp{font-size:11px;font-weight:600;color:var(--mu);margin:16px 10px 6px}
.nav{display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 10px;border:0;border-radius:10px;background:none;color:var(--tx);cursor:pointer;text-align:left}
.nav:hover:not(:disabled){background:var(--soft)}.nav.on{background:var(--soft);color:var(--brand);font-weight:600}.nav.off,.nav:disabled{color:var(--mu);cursor:default;opacity:.8}
.ic{width:20px;height:20px;flex:none}.nav .tag{margin-left:auto}.lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tag{font-size:10px;border:1px solid var(--bd);border-radius:999px;padding:0 7px;color:var(--mu)}
.side-f{border-top:1px solid var(--bd);padding:8px 10px}.side-f .nav .ic{transition:transform .15s}
body.rail #side{width:76px}body.rail .prod,body.rail .lb,body.rail .nav .tag,body.rail .grp span{display:none}
body.rail .brand{padding:16px 12px 8px;justify-content:center}body.rail .brand img{width:48px;height:48px}
body.rail .grp{height:1px;background:var(--bd);margin:10px 14px}body.rail .nav{justify-content:center;padding:0}body.rail .side-f .ic{transform:rotate(180deg)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--surf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.crumb{display:flex;gap:8px;align-items:center;color:var(--mu);font-size:13px;min-width:0}.crumb span:not(:last-of-type)::after{content:"/";margin-left:8px;color:var(--bd)}.crumb b{color:var(--tx);font-weight:600}
.search{position:relative;flex:1 1 260px;max-width:380px;margin-left:auto}.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mu)}.search input{width:100%;padding-left:34px;border-radius:999px;background:var(--bg)}
.iconbtn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--surf);color:var(--tx);display:grid;place-items:center;cursor:pointer}.iconbtn:hover{background:var(--soft)}.iconbtn svg{width:18px;height:18px}
#bdg{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--er);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.me{display:flex;align-items:center;gap:8px}.av{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--brand);display:inline-grid;place-items:center;font-size:11px;font-weight:600;font-style:normal;flex:none}
.who{display:flex;align-items:center;gap:10px}
#menu{display:none}.mlogo{display:none;width:36px;height:36px}
.strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--soft);color:var(--tx);border-bottom:1px solid var(--bd)}
.chip{background:var(--btn);color:#fff;border-radius:999px;padding:1px 10px;font-weight:600;font-size:11px}.grow{flex:1}.mu{color:var(--mu)}
main{padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));width:100%;max-width:1480px}
.ph{margin-bottom:18px}.ph p{color:var(--mu);margin:6px 0 0;max-width:70ch}
.sub{color:var(--mu);margin:0 0 14px}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:var(--sh)}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(auto-fill,minmax(188px,1fr))}.charts{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.sec{margin:26px 0 10px;font-size:15px}
.hero{background:var(--hero);color:#fff;border-radius:18px;padding:22px 24px;display:flex;gap:18px;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.hero h2{color:#fff}.hi{font-size:13px;opacity:.88}.hl{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:4px 0}.hs{font-size:12px;opacity:.8}
.hchips{display:flex;gap:8px;flex-wrap:wrap;align-self:center;max-width:620px}
.hchip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:7px 14px;cursor:pointer}.hchip:hover{background:rgba(255,255,255,.26)}.hchip:focus-visible{outline:2px solid #fff;outline-offset:2px}
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}.fp{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mu)}.fp select{min-width:140px}
select,input{color:var(--tx);background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.b{color:var(--tx);background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;cursor:pointer}.b:hover:not(:disabled){background:var(--soft)}.b:disabled{opacity:.5;cursor:default}
.b.p{background:var(--btn);border-color:var(--btn);color:#fff}.b.p:hover{background:var(--btn-d)}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}.seg button{border:0;background:var(--surf);color:var(--tx);padding:7px 12px;cursor:pointer}.seg button.on{background:var(--btn);color:#fff}
.notice{background:var(--wnb);color:var(--wn);border:1px solid var(--wn);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px}.notice.sm{background:var(--soft);color:var(--tx);border-color:var(--bd)}
button.k{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;color:inherit;cursor:pointer;gap:2px}
button.k:hover,button.al:hover{border-color:var(--brand);background:var(--soft)}
div.k{display:flex;flex-direction:column;align-items:flex-start}
.k .l{color:var(--mu);font-size:12px}.k .v{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.15}.k .d{color:var(--mu);font-size:12px;margin-top:4px}
.k .dl{font-size:11px;background:var(--soft);color:var(--tx);border-radius:999px;padding:1px 9px;margin-top:2px}.k.na .v{color:var(--mu)}
.cs{color:var(--mu);font-size:12px;margin:-4px 0 10px}.ch{min-height:220px}.lock .empty{padding:36px 8px}
.empty{color:var(--mu);font-size:13px;padding:16px 0;text-align:center}
svg{max-width:100%;height:auto;display:block}.ax{font-size:9px;fill:var(--mu)}
.row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}.row .n{width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .t{flex:1;background:var(--soft);border-radius:6px;height:14px}.row .f{background:var(--brand);height:100%;border-radius:6px}
button.hb{background:none;border:0;width:100%;color:inherit;text-align:left;cursor:pointer;padding:2px 0}button.hb:hover .f{background:var(--brand-d)}
.dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.dn svg{width:120px}
button.lg{display:flex;gap:8px;align-items:center;background:none;border:0;color:inherit;cursor:pointer;padding:3px 0}button.lg i,.leg i{display:inline-block;width:10px;height:10px;border-radius:3px}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:6px}.leg span{display:flex;gap:5px;align-items:center}
.als{display:grid;gap:2px}button.al{display:flex;align-items:center;gap:10px;width:100%;background:none;border:1px solid transparent;border-radius:10px;padding:10px 12px;color:inherit;text-align:left;cursor:pointer}button.al span:nth-child(2){flex:1}button.al.nd{opacity:.65}
.sv{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}.sv.high{background:var(--er)}.sv.med{background:var(--wn)}.sv.low{background:var(--c3)}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:12px}tbody tr:hover td,tr:hover>td{background:var(--soft)}
.badge{border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500}.s-ok{background:var(--okb);color:var(--ok)}.s-wn{background:var(--wnb);color:var(--wn)}.s-er{background:var(--erb);color:var(--er)}.s-mu{background:var(--soft);color:var(--mu)}
form.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;align-items:end}label{display:block;font-size:12px;color:var(--mu)}label input,label select{width:100%;margin-top:4px}
.err{color:var(--er);font-size:12px;min-height:16px;margin-top:6px}
.act{margin:6px 0;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--bd);padding-bottom:6px;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ws-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.ws{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}.clk{font-size:34px;font-weight:600;letter-spacing:-.02em}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--surf);border-left:1px solid var(--bd);border-radius:18px 0 0 18px;box-shadow:-10px 0 30px rgba(0,0,0,.14);transform:translateX(105%);transition:transform .18s;z-index:40;display:flex;flex-direction:column;padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#drawer.open{transform:none}#drawer h2{font-size:18px;margin:0}#dd{color:var(--mu);margin:4px 0 14px;font-size:13px}#db{flex:1;overflow:auto;min-width:0}.dh{display:flex;gap:8px;align-items:center;justify-content:space-between}
.scrim{position:fixed;inset:0;background:rgba(10,17,29,.55);display:grid;place-items:center;z-index:60;padding:16px}.dlg{background:var(--surf);border-radius:16px;padding:22px;max-width:400px;width:100%}.dlg p{margin:0 0 18px}.dlg div{display:flex;gap:8px;justify-content:flex-end}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#gate .box{background:var(--surf);border:1px solid var(--bd);border-radius:20px;padding:30px;width:100%;max-width:400px;text-align:center}#gate img{width:150px;height:150px;display:block;margin:0 auto 18px}
#gate h2{font-size:20px;margin:0 0 6px}#gate p{color:var(--mu);margin:0 0 18px;font-size:13px}#gate label{text-align:left;margin-bottom:16px}#gate .b{width:100%;padding:10px}
@media(max-width:900px){#side{position:fixed;left:0;top:0;height:100%;transform:translateX(-105%);transition:transform .18s;box-shadow:8px 0 30px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px)}#side.open{transform:none}body.rail #side{width:288px}body.rail .prod,body.rail .lb{display:revert}body.rail .nav .tag{display:revert}body.rail .grp span{display:revert}.side-f{display:none}#menu{display:inline-block}.mlogo{display:block}.search{order:9;flex:1 1 100%;max-width:none;margin-left:0}.crumb{display:none}.hero{padding:18px}.hl{font-size:22px}}

 <h2 class="sec">My requests</h2><div class="card wrap">${mine.length||seed.length?`<table><tr><th>Type</th><th>Dates</th><th>Days</th><th>Status</th><th>Approver</th><th></th></tr>${mine.map(r=>`<tr><td>${r.type}</td><td>${r.start} → ${r.end}</td><td>${r.days}</td><td><span class="badge ${r.status==="Pending"?"s-wn":"s-ok"}">${r.status}</span></td><td>${esc(e.mgr||"–")}</td><td>${r.status==="Pending"?`<button class="b" data-ws="cancel:${r.id}">Cancel</button>`:""}</td></tr>`).join("")}${seed.map(a=>`<tr><td colspan="2">${esc(a.detail)}</td><td>–</td><td><span class="badge s-wn">Pending</span></td><td>${esc(e.mgr||"–")}</td><td></td></tr>`).join("")}</table>`:`<div class="empty">No requests yet. Use the form above to submit your first leave request.</div>`}</div>`}

const ICN={"HR Dashboard":"dash","Payroll Dashboard":"wallet","My Workspace":"user","Employment Contracts":"file","Employee Documents":"file","Departments":"briefcase","Tax & Insurance Settings":"shield","Audit Logs":"shield"},ICG={Overview:"dash",People:"users","Time & Attendance":"clock",Leave:"calendar",Payroll:"wallet",Talent:"target",Reports:"chart",Administration:"sliders"};
const ic=(n,g)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${IC[ICN[n]||ICG[g]]}"/></svg>`;
const ini=n=>String(n||"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
let FM=false;
function nav(){$("#nav").innerHTML=Object.entries(NAV).filter(([g])=>ALLOW(g)).map(([g,items])=>`<div class="grp"><span>${g}</span></div>`+items.map(([n,k])=>k?`<button class="nav ${k===page?"on":""}" data-k="${k}" title="${n}" ${canSee(k)?"":"disabled"}>${ic(n,g)}<span class="lb">${n}</span></button>`:`<button class="nav off" disabled title="${n} (planned)">${ic(n,g)}<span class="lb">${n}</span><span class="tag">Soon</span></button>`).join("")).join("");
 document.querySelectorAll(".nav[data-k]").forEach(b=>b.onclick=()=>{page=b.dataset.k;PG=0;$("#side").classList.remove("open");closeDr();draw()})}
function updBell(){const b=$("#bdg");if(role==="Employee"||!canSee("dash")){b.hidden=true;return}const m=page==="dash"?M:build(),n=m.alerts.filter(a=>a[0]!=="low"&&a[3]).length;b.textContent=n;b.hidden=!n}
function openNotif(){if(role==="Employee"||!canSee("dash"))return;const m=build(),order={high:0,med:1,low:2};LASTDRILL=null;$("#dt").textContent="Notifications";$("#dd").textContent="Items that need attention, most urgent first. Select one to see the records.";
 $("#db").innerHTML=m.alerts.filter(a=>a[3]).sort((a,b)=>order[a[0]]-order[b[0]]).map(([sv,t,id,n])=>`<button class="al" data-d="${id}"><i class="sv ${sv}"></i><span>${t}</span><span class="badge ${sv==="high"?"s-er":sv==="med"?"s-wn":"s-mu"}">${n}</span></button>`).join("")||`<div class="empty">Nothing needs attention right now.</div>`;$("#dx").hidden=true;$("#drawer").classList.add("open");$("#dcl").focus()}
function draw(){const[t,d]=META[page];$("#title").textContent=t;$("#desc").textContent=d;nav();
 const grp={dash:"Overview",work:"Overview",emp:"People",comp:"Payroll"}[page];$("#crumb").innerHTML=`<span>SMR</span><span>${grp}</span><b>${t}</b>`;
 document.querySelectorAll("[data-mode]").forEach(b=>{const on=b.dataset.mode===MODE;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});
 $("#me").textContent=ini(role);$("#gs").disabled=!canSee("emp");$("#gs").placeholder=canSee("emp")?"Search employees":"Search not available";
 $("#strip").innerHTML=(MODE==="sample"?`<span class="chip">Sample data</span><span>Generated for demonstration. These are not real SMR employees or records.</span>`:`<span class="chip">My records</span><span>Only the employees you entered. Cards without a data source show as unavailable.</span>`)+`<span class="grow"></span><span class="mu">Prototype: data and roles stay in this browser.</span>`;
 $("#view").innerHTML=page==="dash"?dash():page==="emp"?emp():page==="work"?work():comp();wire();updBell()}
function openDr(id){const f=M.DR&&M.DR[id];if(!f)return;const o=f();LASTDRILL=o;
 $("#dt").textContent=o.title;$("#dd").textContent=o.desc||"";
 $("#db").innerHTML=o.rows.length?`<div class="wrap"><table><tr>${o.cols.map(c=>`<th>${c}</th>`).join("")}</tr>${o.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div>`:`<div class="empty">${o.cols.length?"No records match the current filters.":esc(o.desc)}</div>`;
 $("#dx").hidden=!o.rows.length;$("#drawer").classList.add("open");$("#dcl").focus()}
function closeDr(){$("#drawer").classList.remove("open")}
function csv(){if(!LASTDRILL||!LASTDRILL.rows.length)return;const q=v=>'"'+String(v).replace(/"/g,'""').replace(/^([=+\-@])/,"'$1")+'"',t=[LASTDRILL.cols,...LASTDRILL.rows].map(r=>r.map(q).join(",")).join("\n"),b=$("#dx"),done=()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy as CSV",1600)};
 const fb=()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();done()};
 try{navigator.clipboard.writeText(t).then(done,fb)}catch(e){fb()}}
function ask(msg,label,fn){$("#cm").textContent=msg;const y=$("#cy");y.textContent=label;$("#confirm").hidden=false;y.focus();y.onclick=()=>{$("#confirm").hidden=true;fn()};$("#cn").onclick=()=>{$("#confirm").hidden=true}}
document.addEventListener("click",ev=>{const t=ev.target.closest("[data-f],[data-d],[data-mode],[data-pg],#dcl,#dx");if(!t)return;
 if(t.id==="dcl")return closeDr();if(t.id==="dx")return csv();
 if(t.dataset.mode){MODE=t.dataset.mode;try{localStorage.setItem("smr_mode",MODE)}catch(e){}F={dept:"",loc:"",mgr:"",type:"",status:""};PG=0;closeDr();return draw()}
 if(t.dataset.pg){PG+=+t.dataset.pg;return draw()}
 if(t.dataset.d)return openDr(t.dataset.d);
 if(t.dataset.f){const[k,v]=t.dataset.f.split(":");F[k]=F[k]===v?"":v;draw()}});
document.addEventListener("click",ev=>{const t=ev.target.closest("[data-ws]");if(!t)return;const a=t.dataset.ws;
 if(a==="punch"){const e=allEmps().find(x=>x.no===WSNO),k=WSNO+"|"+iso(T0);PUNCH[k]=(PUNCH[k]||[]).concat(new Date().toISOString());saveW();draw()}
 if(a.startsWith("cancel:")){const id=+a.slice(7);ask("Cancel this leave request?","Cancel request",()=>{LR=LR.filter(r=>r.id!==id);saveW();draw()})}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDr()});
function wire(){const ws=$("#wsel");if(ws)ws.onchange=e=>{WSNO=e.target.value;draw()};
 const lf=$("#lf");if(lf)lf.onsubmit=ev=>{ev.preventDefault();const o=Object.fromEntries(new FormData(lf)),er=$("#lerr"),e=allEmps().find(x=>x.no===WSNO),b=balances(e)[o.type];
  if(o.end<o.start){er.textContent="The end date must be on or after the start date.";return}
  const days=wdays(o.start,o.end);if(!days){er.textContent="The selected dates contain no working days.";return}
  if(LR.some(r=>r.mode===MODE&&r.no===e.no&&r.status!=="Rejected"&&r.start<=o.end&&r.end>=o.start)){er.textContent="These dates overlap an existing leave request.";return}
  if(b.avail!=null&&days>b.avail){er.textContent="Not enough balance: "+b.avail+" day(s) available, "+days+" requested.";return}
  LR.push({id:Date.now(),mode:MODE,no:e.no,type:o.type,start:o.start,end:o.end,days,note:o.note,status:"Pending"});saveW();draw()};document.querySelectorAll("select[data-k]").forEach(s=>s.onchange=e=>{F[s.dataset.k]=e.target.value;PG=0;draw()});
 const pm=$("#pm");if(pm)pm.onchange=e=>{PM=+e.target.value;draw()};const rg=$("#rg");if(rg)rg.onchange=e=>{RANGE=+e.target.value;draw()};
 const r=$("#fr");if(r)r.onclick=()=>{F={dept:"",loc:"",mgr:"",type:"",status:""};draw()};const rf=$("#rf");if(rf)rf.onclick=()=>{REFRESHED=new Date();draw()};
 const q=$("#q");if(q)q.oninput=e=>{Q=e.target.value;PG=0;const p=e.target.selectionStart;draw();const n=$("#q");n.focus();n.setSelectionRange(p,p)};
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ask("Archive this employee? Their record is hidden from the directory.","Archive",()=>{E=E.filter(e=>e.no!==b.dataset.del);save();draw()})});
 const f=$("#ef");if(f)f.onsubmit=ev=>{ev.preventDefault();const o=Object.fromEntries(new FormData(f));o.no=o.no.trim();o.name=o.name.trim();
  if(E.some(e=>e.no===o.no)){$("#er").textContent="Employee number "+o.no+" already exists. Use a unique number.";return}
  if(o.end&&o.end<o.hire){$("#er").textContent="Contract end date must be after the hire date.";return}
  if(o.term&&o.term<o.hire){$("#er").textContent="Employment end date must be after the hire date.";return}
  if(o.status==="Terminated"&&!o.term){$("#er").textContent="Enter the employment end date for a terminated employee.";return}
  E.push(o);save();draw()}}
document.addEventListener("click",ev=>{const t=ev.target.closest("[data-x]");if(!t)return;const x=t.dataset.x;
 if(x==="more"){FM=!FM;draw()}
 if(x==="collapse"){const r=document.body.classList.toggle("rail");try{localStorage.setItem("smr_rail",r?"1":"0")}catch(e){}}
 if(x==="bell")openNotif()});
$("#gs").onkeydown=e=>{if(e.key==="Enter"&&canSee("emp")){Q=e.target.value;page="emp";PG=0;closeDr();draw()}};
try{if(localStorage.getItem("smr_rail")==="1")document.body.classList.add("rail")}catch(e){}
draw();
